<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>清北围棋 · xinyarennengfei</title>
<style>
  :root{
    --ink:#f4f1ff;--dim:#b9aed6;--dim2:#8d83b0;--gold:#fbbf24;
    --q:#8b5cf6;--p:#ec4899;--cyan:#22d3ee;--line:rgba(255,255,255,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
  html,body{height:100%}
  body{
    font-family:"Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);overflow:hidden;background:#0a0820;
    background:radial-gradient(900px 520px at 82% -12%,rgba(139,92,246,.38),transparent 58%),
      radial-gradient(720px 460px at -8% 112%,rgba(236,72,153,.22),transparent 60%),
      radial-gradient(680px 420px at 50% 50%,rgba(34,211,238,.10),transparent 65%),
      linear-gradient(160deg,#0c0a24 0%,#1a1340 48%,#0e0a26 100%);
  }
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.06);
    border-bottom:1px solid var(--line);backdrop-filter:blur(10px);z-index:6;box-shadow:0 4px 20px rgba(0,0,0,.3)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:1px;
    background:linear-gradient(110deg,#fbbf24,#f97316,#ec4899,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 8px rgba(168,85,247,.4))}
  .logo img{width:26px;height:26px;border-radius:50%;background:#fff;object-fit:cover}
  .logo img:first-child{box-shadow:0 0 0 2px rgba(139,92,246,.9),0 0 0 3.5px #fff,0 0 12px rgba(139,92,246,.5)}
  .logo img+img{box-shadow:0 0 0 2px rgba(236,72,153,.9),0 0 0 3.5px #fff,0 0 12px rgba(236,72,153,.5);margin-left:-5px}
  .lgT{margin-left:7px}
  .ico{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;
    font-weight:800;font-size:13px;color:#fff;letter-spacing:0;
    box-shadow:0 0 0 2px rgba(255,255,255,.85),0 2px 5px rgba(0,0,0,.45);vertical-align:middle;flex:none}
  .ico.sm{width:18px;height:18px;font-size:10px;box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 1px 3px rgba(0,0,0,.35)}
  .ico.mid{width:22px;height:22px;font-size:11px}
  .icoqh{background:linear-gradient(135deg,#8b5cf6 0%,#a855f7 55%,#c4b5fd 100%);text-shadow:0 1px 0 rgba(0,0,0,.35)}
  .icopk{background:linear-gradient(135deg,#ec4899 0%,#f43f5e 55%,#fda4af 100%);text-shadow:0 1px 0 rgba(0,0,0,.35)}
  .sp{flex:1}
  .turnpill{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:800;font-size:14px;
    border:1px solid var(--line);background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,.04));
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
  .turnpill img{width:22px;height:22px;border-radius:50%;background:#fff}
  .conn{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:5px 12px;display:none}
  .conn.show{display:block}
  .conn.ok{border-color:#2ecc71;color:#7bed9f;box-shadow:0 0 10px rgba(46,204,113,.3)}
  .conn.wait{border-color:#fbbf24;color:#fde68a;box-shadow:0 0 10px rgba(251,191,36,.3)}
  main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0}
  #boardWrap{position:relative;line-height:0;padding:10px}
  canvas#board{width:min(94vw,calc(100vh - 205px),720px);aspect-ratio:1;border-radius:16px;touch-action:none;
    box-shadow:0 24px 80px rgba(0,0,0,.55),0 0 0 1px rgba(139,92,246,.25),0 0 30px rgba(139,92,246,.15)}
  footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;justify-content:center;
    background:rgba(255,255,255,.05);border-top:1px solid var(--line);z-index:6;backdrop-filter:blur(6px)}
  .btn{border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--ink);
    background:rgba(255,255,255,.09);transition:all .18s;white-space:nowrap}
  .btn:hover{background:rgba(139,92,246,.2);border-color:rgba(139,92,246,.5);box-shadow:0 0 12px rgba(139,92,246,.3)}
  .btn:active{transform:scale(.96)}
  .btn.gold{background:linear-gradient(120deg,#fbbf24,#f59e0b);color:#2a1a00;font-weight:800;box-shadow:0 6px 18px rgba(251,191,36,.35)}
  .btn.sel{box-shadow:0 0 0 2px #fbbf24 inset;background:rgba(251,191,36,.15)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .timers{display:flex;align-items:center;gap:8px}
  .tm{display:flex;align-items:center;gap:5px;background:rgba(255,255,255,.08);border:1px solid var(--line);
    border-radius:999px;padding:5px 10px;font-size:12.5px;transition:all .2s}
  .tm b{font-variant-numeric:tabular-nums}
  .tm.hot{border-color:#fbbf24;box-shadow:0 0 12px rgba(251,191,36,.35)}
  .tm.low b{color:#ff6b6b}
  .caps{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;
    padding:5px 12px;font-size:12px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
  .tm img{width:18px;height:18px;border-radius:50%;background:#fff}
  #hist{position:absolute;top:12px;left:12px;width:min(240px,70vw);max-height:64%;display:flex;flex-direction:column;
    background:rgba(20,12,45,.94);border:1px solid var(--line);border-radius:14px;padding:10px;z-index:9;backdrop-filter:blur(6px);
    box-shadow:0 14px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)}
  #hist.hide{display:none}
  #hist h4{font-size:13px;display:flex;justify-content:space-between;margin-bottom:6px;color:#fff}
  #hist h4 button{border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;border-radius:8px;width:22px;height:22px;cursor:pointer;transition:all .2s}
  #hist h4 button:hover{background:rgba(139,92,246,.3);box-shadow:0 0 10px rgba(139,92,246,.4)}
  #histList{overflow:auto;font-size:12px;line-height:1.9;color:var(--dim)}
  #histList .q{color:#c4b5fd} #histList .p{color:#fda4af}
  .modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;background:rgba(6,4,18,.74);backdrop-filter:blur(6px)}
  .modal.show{display:flex}
  .mcard{width:min(560px,92vw);max-height:90%;overflow:auto;background:linear-gradient(170deg,rgba(40,24,72,.96),rgba(20,12,40,.96));
    border:1px solid var(--line);border-radius:20px;padding:22px;text-align:center;box-shadow:0 28px 80px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.1)}
  .mcard h2{font-size:26px;letter-spacing:2px;margin-bottom:8px;font-weight:900;
    background:linear-gradient(110deg,#fbbf24,#f97316,#ec4899,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 2px 10px rgba(168,85,247,.4))}
  .mcard .sub{color:var(--dim);font-size:13px;line-height:1.9;margin-bottom:12px}
  .rows{display:flex;gap:10px;justify-content:center;margin:10px 0}
  .mode-card{flex:1;max-width:170px;border:1.5px solid var(--line);border-radius:12px;padding:10px 8px;cursor:pointer;
    background:rgba(255,255,255,.05);font-size:14px;line-height:1.7;transition:all .2s}
  .mode-card small{color:var(--dim);font-size:11px;display:block}
  .mode-card.sel{border-color:#fbbf24;background:rgba(251,191,36,.15);box-shadow:0 0 14px rgba(251,191,36,.3)}
  .mode-card:active{transform:scale(.96)}
  textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:10px;color:#dfe6ff;
    font-family:Consolas,monospace;font-size:11px;padding:8px;min-height:70px;resize:vertical;outline:none;transition:all .2s}
  textarea:focus{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.15)}
  .lab{font-size:12px;color:var(--dim);text-align:left;margin:8px 2px 4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .copybtn{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;margin-left:6px;transition:all .2s}
  .copybtn:hover{background:rgba(139,92,246,.3);box-shadow:0 0 10px rgba(139,92,246,.4)}
  .status{font-size:13px;margin:6px 0;min-height:20px}
  .status.ok{color:#7bed9f}.status.wait{color:#fde68a}.status.err{color:#ff9aa0}
  .hint{font-size:11px;color:rgba(185,174,214,.6);margin-top:8px}
  input[type=text]{background:rgba(255,255,255,.07);border:1px solid var(--line);border-radius:10px;color:#fff;padding:9px 12px;font-size:15px;outline:none;width:100%;text-align:center;transition:all .2s}
  input:focus{border-color:#fbbf24;box-shadow:0 0 0 3px rgba(251,191,36,.15)}
  .mini{font-size:12px;color:var(--dim)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="ico icoqh">清</span><span class="ico icopk">北</span><span class="lgT">清北围棋</span></div>
    <span class="sp"></span>
    <span class="conn" id="connBox"></span>
    <div class="turnpill" id="turnPill"></div>
  </header>
  <main>
    <div id="boardWrap">
      <canvas id="board"></canvas>
      <div id="hist" class="hide">
        <h4>📜 棋谱 <button id="histClose">✕</button></h4>
        <div id="histList"></div>
      </div>
    </div>
  </main>
  <footer>
    <div class="grp">
      <button class="btn" id="undoBtn">↩ 悔棋</button>
      <button class="btn" id="resetBtn">🔄 重开</button>
      <button class="btn" id="histBtn">📜 棋谱</button>
      <button class="btn" id="passBtn">⏸ 停一手</button>
      <button class="btn" id="overBtn">🏁 结束计分</button>
    </div>
    <span class="sp"></span>
    <div class="timers">
      <span class="tm" id="tmQ"><span class="ico sm icoqh">清</span><b>120</b></span>
      <span class="tm" id="tmP"><span class="ico sm icopk">北</span><b>120</b></span>
      <span class="caps" id="capsTxt">提：清0 · 北0</span>
    </div>
    <span class="sp"></span>
    <div class="grp">
      <button class="btn mode" data-m="local">🏠 本地双人</button>
      <button class="btn mode" data-m="ai">🤖 AI 初级</button>
      <button class="btn mode" data-m="ai2">🤖 AI 中级</button>
      <button class="btn mode" data-m="p2p">🌐 联机对战</button>
    </div>
  </footer>
</div>

<!-- 通用弹窗 -->
<div class="modal" id="modal">
  <div class="mcard" id="mcard"></div>
</div>

let caps=[0,0];               // caps[0]=黑提白数 caps[1]=白提黑数
let turn=1,over=false,lastWasPass=false;
let koHist=[];
let snap=[];                  // 悔棋快照
let timers=[MOVE_TIME,MOVE_TIME],lastTs=0,started=false;
let peer=null,dc=null,p2pRole=0;
let aiThinking=false;
let lastMove=null;
let hover={x:-1,y:-1};

/* ============ 画布(与五子棋一致的木纹/棋子/水印) ============ */
const cv=$('#board'),ctx=cv.getContext('2d');
const SIZE=860,M=38,CELL=(SIZE-2*M)/18;   // 19路
cv.width=SIZE;cv.height=SIZE;
const PX=c=>M+c*CELL, PY=r=>M+r*CELL;

function newGrid(){return Array.from({length:N},()=>Array(N).fill(0))}
function cloneGrid(g){return g.map(r=>r.slice())}
function boardStr(g){let s='';for(const row of g)s+=row.join('');return s}
function resetBoard(){
  grid=newGrid();caps=[0,0];over=false;lastWasPass=false;koHist=[];
  snap=[];lastMove=null;timers=[MOVE_TIME,MOVE_TIME];
  started=false;lastTs=performance.now();
  setTurn(mode==='p2p'?(p2pRole===1?1:2):1);
  updateHUD();render();
}
function setTurn(w){turn=w;timers[w===1?0:1]=MOVE_TIME;updateHUD();lastTs=performance.now()}
function other(w){return w===1?2:1}
function stoneW(){return turn===1}

/* ---------- 提子/块/气 ---------- */
function groupCells(r,c,who){
  const seen=Array.from({length:N},()=>Array(N).fill(false));
  const cells=[],q=[[r,c]];seen[r][c]=true;
  while(q.length){
    const [a,b]=q.pop();cells.push([a,b]);
    for(const [dr,dc] of DIRS){const nr=a+dr,nb=b+dc;
      if(inB(nr,nb)&&!seen[nr][nb]&&grid[nr][nb]===who){seen[nr][nb]=true;q.push([nr,nb]);}
    }
  }
  return cells;
}
function libertiesOf(cells){
  const s=new Set();
  for(const [r,c] of cells)for(const [dr,dc] of DIRS){
    const nr=r+dr,nb=c+dc;
    if(inB(nr,nb)&&grid[nr][nb]===0)s.add(nr*N+nb);
  }
  return s;
}
function deadGroups(who){
  const dead=[];
  const vis=Array.from({length:N},()=>Array(N).fill(false));
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(grid[r][c]===who&&!vis[r][c]){
      const cells=groupCells(r,c,who);
      cells.forEach(([a,b])=>vis[a][b]=true);
      if(libertiesOf(cells).size===0)dead.push(cells);
    }
  }
  return dead;
}
/* 试算一手：合法=非自填+不打劫(位置重现) */
function legalTry(x,y,who){
  if(grid[y][x]!==0)return {ok:false};
  const save=cloneGrid(grid);
  grid[y][x]=who;
  const opp=other(who);
  let capture=0;
  for(const g of deadGroups(opp)){capture+=g.length;g.forEach(([r,c])=>grid[r][c]=0);}
  const own=groupCells(y,x,who);
  let ok=capture>0||libertiesOf(own).size>0;
  if(ok){
    const st=boardStr(grid);
    if(koHist.includes(st))ok=false; // 简单劫/超劫(位置重现禁手)
  }
  // 恢复
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)grid[r][c]=save[r][c];
  return {ok,capture};
}
/* 真正落子(由调用方保证合法) */
function applyMove(x,y,who){
  grid[y][x]=who;
  const opp=other(who);
  let got=0;
  for(const g of deadGroups(opp)){
    got+=g.length;
    g.forEach(([r,c])=>{grid[r][c]=0;caps[who===1?0:1]++}); // caps[0]=黑(清华)提子 caps[1]=白(北大)提子
  }
  return got;
}
function pushSnap(){
  snap.push({g:cloneGrid(grid),caps:caps.slice(),turn,lastWasPass,ko:koHist.slice()});
  if(snap.length>400)snap.shift();
}
function popSnap(){
  const s=snap.pop();if(!s)return false;
  grid=s.g;caps=s.caps;turn=s.turn;lastWasPass=s.lastWasPass;koHist=s.ko;
  over=false;lastMove=null;updateHUD();render();return true;
}

/* ============ 落子 / 停一手 / 终局计分 ============ */
function doMove(x,y,who,from){
  if(over||aiThinking||who!==turn)return false;
  const chk=legalTry(x,y,who);
  if(!chk.ok)return false;
  pushSnap();
  const got=applyMove(x,y,who);
  const st=boardStr(grid);
  koHist.push(st);if(koHist.length>80)koHist.shift();
  historyList.push({x,y,who,type:'move',capture:got});
  lastMove={x,y};lastWasPass=false;started=true;
  Snd.click();
  const nx=other(who);
  setTurn(nx);
  if(mode!=='p2p'&&(mode==='ai'||mode==='ai2')&&nx===2)scheduleAI();
  if(mode==='p2p'&&from==='local'&&dc&&dc.readyState==='open')dc.send(JSON.stringify({t:'move',x,y}));
  updateHUD();render();
  return true;
}
function doPass(who,from){
  if(over||aiThinking||who!==turn)return false;
  pushSnap();
  if(lastWasPass){// 连续两停一手 → 终局数子
    finishScore();
    return true;
  }
  lastWasPass=true;started=true;
  const nx=other(who);
  setTurn(nx);
  if(mode!=='p2p'&&(mode==='ai'||mode==='ai2')&&nx===2)scheduleAI();
  if(mode==='p2p'&&from==='local'&&dc&&dc.readyState==='open')dc.send(JSON.stringify({t:'pass'}));
  updateHUD();render();
  return true;
}
/* 终局计分：数子法(黑:子+地；白:子+地+贴目7.5) */
function computeScore(){
  const vis=Array.from({length:N},()=>Array(N).fill(false));
  let blk=0,wht=0,blkT=0,whtT=0;
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){if(grid[r][c]===1)blk++;else if(grid[r][c]===2)wht++;}
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(grid[r][c]!==0||vis[r][c])continue;
    const q=[[r,c]],cells=[];vis[r][c]=true;
    const touch=new Set();
    while(q.length){
      const [a,b]=q.pop();cells.push([a,b]);
      for(const [dr,dc] of DIRS){const nr=a+dr,nb=b+dc;
        if(!inB(nr,nb))continue;
        if(grid[nr][nb]===0&&!vis[nr][nb]){vis[nr][nb]=true;q.push([nr,nb]);}
        else if(grid[nr][nb]!==0)touch.add(grid[nr][nb]);
      }
    }
    if(touch.size===1&&touch.has(1))blkT+=cells.length;
    else if(touch.size===1&&touch.has(2))whtT+=cells.length;
  }
  const scoreB=blk+blkT,scoreW=wht+whtT+KOMI;
  return {blk,wht,blkT,whtT,scoreB,scoreW};
}
function finishScore(){
  if(over)return;over=true;started=false;
  const s=computeScore();
  const win=s.scoreB>s.scoreW?1:(s.scoreB<s.scoreW?2:0);
  const isQ=win===1;
  if(mode==='p2p'&&dc&&dc.readyState==='open')sendMsg({t:'over',score:s});
  if(win===1)Snd.win();else if(win===2)Snd.lose();
  updateHUD();render();
  setTimeout(()=>{
    const t='终局 · 数子';
    const sub=(win===1?'🎉 清华胜利！':win===2?'🎈 清华虽败犹荣！':'🤝 和棋')+
      '<br>清华(黑)：子'+s.blk+' + 地'+s.blkT+' = <b>'+s.scoreB.toFixed(1)+'</b>'+
      '<br>北大(白)：子'+s.wht+' + 地'+s.whtT+' + 贴目'+KOMI+' = <b>'+s.scoreW.toFixed(1)+'</b>'+
      '<br>提子：清华提'+caps[0]+' · 北大提'+caps[1];
    showOver(t,sub,true);
  },300);
}

/* ============ 绘制 ============ */
function woodBg(){
  const g=ctx.createLinearGradient(0,0,SIZE,SIZE);
  g.addColorStop(0,'#DEB887');g.addColorStop(1,'#D2A679');
  ctx.fillStyle=g;ctx.fillRect(0,0,SIZE,SIZE);
  ctx.strokeStyle='rgba(120,80,40,.12)';
  for(let i=0;i<48;i++){ctx.beginPath();ctx.moveTo(rand(0,SIZE),0);ctx.lineTo(rand(0,SIZE),SIZE);ctx.stroke();}
}
function drawGrid(){
  ctx.strokeStyle='#5d3f22';ctx.lineWidth=1;
  for(let i=0;i<N;i++){
    const p=PY(i);
    ctx.beginPath();ctx.moveTo(PX(0),p);ctx.lineTo(PX(N-1),p);ctx.stroke();
    ctx.beginPath();ctx.moveTo(p,PY(0));ctx.lineTo(p,PY(N-1));ctx.stroke();
  }
  // 星位(19路九个)
  ctx.fillStyle='#402c15';
  [[3,3],[3,9],[3,15],[9,3],[9,9],[9,15],[15,3],[15,9],[15,15]].forEach(([r,c])=>{
    ctx.beginPath();ctx.arc(PX(c),PY(r),3.4,0,TAU);ctx.fill();
  });
  // 边线坐标标注(左A-S跳过I, 底1-19)
  ctx.fillStyle='#7a5a33';ctx.font='13px "Microsoft YaHei"';ctx.textAlign='center';ctx.textBaseline='middle';
  const letters='ABCDEFGHJKLMNOPQRST';
  for(let r=0;r<N;r++){ctx.fillText(letters[r],PX(0)-18,PY(r));}
  ctx.textBaseline='middle';
  for(let c=0;c<N;c++){ctx.fillText(String(c+1),PX(c),PY(N-1)+18);}
}
function drawSeal(x,y,r,turn){
  const im=turn===1?imgQ:imgP;
  ctx.save();ctx.translate(x,y);
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=5;ctx.shadowOffsetY=2.5;
  if(imgOK(im)){
    const d=r*2.18;ctx.drawImage(im,-r*1.09,-r*1.09,d,d);
  }else{
    ctx.beginPath();ctx.arc(0,0,r,0,TAU);ctx.fillStyle='#fff';ctx.fill();
    ctx.beginPath();ctx.arc(0,0,r*.86,0,TAU);
    ctx.fillStyle=turn===1?'#6A1B9A':'#C62828';ctx.fill();
    ctx.beginPath();ctx.arc(0,0,r*.56,0,TAU);ctx.fillStyle='#fff';ctx.fill();
    ctx.fillStyle=turn===1?'#6A1B9A':'#C62828';
    ctx.font='800 '+(r*.6)+'px "Microsoft YaHei"';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(turn===1?'清':'北',0,0);
  }
  ctx.restore();
}
function drawWater(){
  if(!(imgOK(imgQ)&&imgOK(imgP)))return;
  const R=26;
  ctx.save();ctx.globalAlpha=.09;
  ctx.drawImage(imgQ,M-6-R,M-6-R,R*2,R*2);
  ctx.drawImage(imgP,SIZE-M-R+4,SIZE-M-R+4,R*2,R*2);
  ctx.globalAlpha=.06;
  ctx.drawImage(imgP,M-6-R,SIZE-M-R+4,R*2,R*2);
  ctx.drawImage(imgQ,SIZE-M-R+4,M-6-R,R*2,R*2);
  ctx.restore();
}
function render(){
  ctx.clearRect(0,0,SIZE,SIZE);
  woodBg();drawGrid();drawWater();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(!grid[r][c])continue;
    const x=PX(c),y=PY(r);
    const isLast=lastMove&&lastMove.x===c&&lastMove.y===r;
    ctx.save();
    drawSeal(x,y,CELL*.45,grid[r][c]);
    if(isLast){
      ctx.beginPath();ctx.arc(x,y,CELL*.45+2.5,0,TAU);ctx.lineWidth=2.2;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.stroke();
    }
    ctx.restore();
  }
  if(!over&&hover.x>=0&&hover.y>=0&&grid[hover.y][hover.x]===0&&turnAllowed()){
    ctx.globalAlpha=.4;
    drawSeal(PX(hover.x),PY(hover.y),CELL*.45,turn);
    ctx.globalAlpha=1;
  }
}
function turnAllowed(){
  if(mode==='p2p'){if(!dc||dc.readyState!=='open')return false;return ((p2pRole===1&&turn===1)||(p2pRole===2&&turn===2));}
  if(mode==='ai'||mode==='ai2')return turn===1;
  return true;
}
function boardPos(e){
  const r=cv.getBoundingClientRect();
  const px=(e.clientX-r.left)*(SIZE/r.width),py=(e.clientY-r.top)*(SIZE/r.height);
  const c=Math.round((px-M)/CELL),rr=Math.round((py-M)/CELL);
  if(c<0||c>=N||rr<0||rr>=N)return null;
  return {x:c,y:rr};
}
cv.addEventListener('pointermove',e=>{const p=boardPos(e);hover=p||{x:-1,y:-1};if(!over)render();});
cv.addEventListener('pointerleave',()=>{hover={x:-1,y:-1};if(!over)render();});
cv.addEventListener('pointerdown',e=>{
  if(over||!turnAllowed()||aiThinking)return;
  const p=boardPos(e);if(!p)return;
  doMove(p.x,p.y,turn,'local');
});

/* ============ 音效 ============ */
const Snd=(()=>{
  let ac=null;
  function c(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();return ac}
  function t(f0,f1,d,type,v,dl){const cc=c();if(!cc)return;const tt=cc.currentTime+(dl||0),o=cc.createOscillator(),g=cc.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f0,tt);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),tt+d);
    g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(v||.12,tt+.01);g.gain.exponentialRampToValueAtTime(.0001,tt+d);
    o.connect(g);g.connect(cc.destination);o.start(tt);o.stop(tt+d+.02);}
  return {click(){t(260,95,.09,'triangle',.45)},win(){[523,659,784,1046,1318].forEach((f,i)=>t(f,f,.2,'triangle',.16,i*.12))},lose(){[392,330,262,196].forEach((f,i)=>t(f,f*.9,.28,'sawtooth',.1,i*.16))}};
})();

/* ============ 弹窗 / HUD ============ */
const historyList=[];
function updateHUD(){
  $('#tmQ b').textContent=timers[0].toFixed(0);
  $('#tmP b').textContent=timers[1].toFixed(0);
  $('#tmQ').classList.toggle('hot',!over&&turn===1);
  $('#tmP').classList.toggle('hot',!over&&turn===2);
  $('#tmQ').classList.toggle('low',!over&&timers[0]<20);
  $('#tmP').classList.toggle('low',!over&&timers[1]<20);
  const capsEl=$('#capsTxt');
  if(capsEl)capsEl.textContent='提：清'+caps[0]+' · 北'+caps[1];
  if(!over){
    $('#turnPill').innerHTML=(turn===1?'<span class="ico mid icoqh">清</span>':'<span class="ico mid icopk">北</span>')+
      '<span style="color:'+(turn===1?'#cba2ff':'#ff9aa0')+'">'+(turn===1?'清华回合':'北大回合')+'</span>'+
      (lastWasPass?'<span class="mini" style="margin-left:6px">（上一手停一手）</span>':'');
  }else $('#turnPill').innerHTML='<span>对局已结束</span>';
  $('#histList').innerHTML=historyList.map((h,i)=>
    '<span class="'+(h.who===1?'q':'p')+'">'+(i+1)+' · '+(h.who===1?'清华':'北大')+
    (h.type==='pass'?' · 停一手':' · ('+(h.x+1)+','+(h.y+1)+')'+(h.capture?' · 提'+h.capture:'') )+'</span>'
  ).join('<br>')||'<span class="mini">暂无落子</span>';
}
function showOver(title,sub){
  $('#mcard').innerHTML='<h2>'+title+'</h2><div class="sub">'+sub+'</div>'+
    '<button class="btn gold" id="mAgain">🔄 再来一局</button><button class="btn" id="mClose">关闭</button>';
  $('#modal').classList.add('show');
  $('#mAgain').onclick=()=>{$('#modal').classList.remove('show');if(mode==='p2p'&&dc&&dc.readyState==='open')sendMsg({t:'reset',n:historyList.length});newGame(mode);};
  $('#mClose').onclick=()=>$('#modal').classList.remove('show');
}
function timeoutWin(loser){
  if(over)return;over=true;started=false;
  const w=other(loser);
  const isQ=w===1;
  if(isQ)Snd.win();else Snd.lose();
  updateHUD();render();
  showOver(isQ?'🎉 清华胜利！':'⏰ 清华超时，虽败犹荣！',(loser===1?'清华思考太久啦':'北大用时耗尽')+'，对局结束');
}

/* ============ 计时 ============ */
function tick(){
  if(!over&&started&&historyList.length>0){
    const now=performance.now(),dt=(now-lastTs)/1000;lastTs=now;
    const idx=turn===1?0:1;
    timers[idx]=Math.max(0,timers[idx]-dt);
    if(timers[idx]<=0)timeoutWin(turn);
    if(!over)updateHUD();
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

/* ============ 按钮 ============ */
$('#passBtn').onclick=()=>{if(!over&&turnAllowed()&&!aiThinking)doPass(turn,'local')};
$('#overBtn').onclick=()=>{if(!over&&historyList.length>0)finishScore()};
function undoStep(){
  if(!popSnap())return false;
  historyList.pop();return true;
}
$('#undoBtn').onclick=()=>{
  if(mode==='p2p')return;
  if(over||!snap.length)return;
  if(mode==='ai'||mode==='ai2'){undoStep();undoStep();} // 撤掉AI一手 + 人类一手
  else undoStep();
};
$('#resetBtn').onclick=()=>{if(mode==='p2p'&&dc&&dc.readyState==='open')sendMsg({t:'reset',n:historyList.length});newGame(mode)};
$('#histBtn').onclick=()=>{const h=$('#hist');if(h.classList.contains('hide'))h.classList.remove('hide');else h.classList.add('hide');updateHUD()};
$('#histClose').onclick=()=>$('#hist').classList.add('hide');

/* ============ 模式/AI ============ */
$$('.mode').forEach(b=>b.addEventListener('click',()=>{enterMode(b.dataset.m);if(b.dataset.m==='p2p')openP2P();}));
function highlightMode(){$$('.mode').forEach(b=>b.classList.toggle('sel',b.dataset.m===mode))}
function leaveP2P(){try{if(peer){peer.close();peer=null}}catch(e){peer=null}dc=null;p2pRole=0;setConn('','')}
function enterMode(m){
  const wasP2P=mode==='p2p';
  mode=m||'local';
  if(mode!=='p2p')leaveP2P();
  else if(!wasP2P)leaveP2P();
  highlightMode();resetBoard();
}
function newGame(m){enterMode(m)}

function aiMove(){
  aiThinking=true;
  setTimeout(()=>{
    aiThinking=false;
    if(over||turn!==2||!(mode==='ai'||mode==='ai2'))return;
    const cands=[];
    for(let r=0;r<N;r++)for(let c=0;c<N;c++){
      if(grid[r][c]!==0)continue;
      const chk=legalTry(c,r,2);
      if(!chk.ok)continue;
      const isMid=mode==='ai2';
      let s=0;
      // 提子/打吃价值
      for(const [dr,dc] of DIRS){
        const nr=r+dr,nb=c+dc;
        if(!inB(nr,nb))continue;
        if(grid[nr][nb]===1){
          const g=groupCells(nr,nb,1);
          const libs=libertiesOf(g).size;
          if(libs===1)s+=g.length*(isMid?16:20);   // 提
          else if(libs===2)s+=isMid?2:1;
        }else if(grid[nr][nb]===2){
          const g=groupCells(nr,nb,2);
          const libs=libertiesOf(g).size;
          if(libs===1)s+=isMid?6:3;                 // 接应/保气
          else s+=isMid?1:0.5;
        }
      }
      // 与己方相邻/中心偏好/少边角
      let ownNb=0;
      for(const [dr,dc] of DIRS){const nr=r+dr,nb=c+dc;if(inB(nr,nb)&&grid[nr][nb]===2)ownNb++;}
      s+=ownNb*(isMid?3:2);
      s+=10-(Math.abs(c-9)+Math.abs(r-9))*0.8;
      if(c<=1||c>=N-2||r<=1||r>=N-2)s-=(isMid?4:1);
      if(!isMid)s+=rand(-8,8);
      cands.push({x:c,y:r,s});
    }
    if(!cands.length){doPass(2,'ai');return;}
    cands.sort((a,b)=>b.s-a.s);
    const pick=isPick(cands);
    doMove(pick.x,pick.y,2,'ai');
  },450);
}
function isPick(arr){return arr[0]||arr[Math.floor(rand(0,Math.min(3,arr.length)))]}
function scheduleAI(){aiMove()}

/* ============ WebRTC 联机(手动SDP交换) ============ */
const rtcCfg={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
function newPeer(){try{return new RTCPeerConnection(rtcCfg)}catch(e){try{return new RTCPeerConnection()}catch(e2){return null}}}
function waitGather(pc){return new Promise(res=>{if(pc.iceGatheringState==='complete')return res();const to=setTimeout(res,2200);pc.onicegatheringstatechange=()=>{if(pc.iceGatheringState==='complete'){clearTimeout(to);res();}}})}
function setConn(text,cls){const b=$('#connBox');b.className='conn '+(cls?'show '+cls:'');b.textContent=text||''}
function sendMsg(obj){if(dc&&dc.readyState==='open'){try{dc.send(JSON.stringify(obj))}catch(e){}}}
function bindDc(){
  dc.onopen=()=>setConn('✅ 已连接','ok');
  dc.onclose=()=>{setConn('❌ 连接已断开','wait');if(!over)showOver('⚠️ 连接断开','与对手的连接已断开，可点“再来一局”重新发起连接。');};
  dc.onerror=()=>setConn('⚠️ 连接错误','wait');
  dc.onmessage=ev=>{
    let m;try{m=JSON.parse(ev.data)}catch(e){return}
    if(m.t==='move'){doMove(m.x,m.y,p2pRole===1?2:1,'remote');}
    else if(m.t==='pass'){doPass(p2pRole===1?2:1,'remote');}
    else if(m.t==='reset'){newGame('p2p');}
    else if(m.t==='over'){if(!over)finishScore();}
  };
}
function roomId(){return 'QBG-'+Math.random().toString(36).slice(2,7).toUpperCase();}
function modal(html){$('#mcard').innerHTML=html;$('#modal').classList.add('show')}
function openCreate(){
  try{if(peer)peer.close()}catch(e){}peer=null;dc=null;
  const rid=roomId(),pc=newPeer();peer=pc;
  if(!pc){alert('当前环境不支持 WebRTC');return}
  dc=pc.createDataChannel('qbwq');bindDc();
  modal('<h2>🌐 创建房间（联机·围棋）</h2>'+
    '<div class="sub">你是 <b style="color:#cba2ff">清华(黑先)</b>。复制<b>房间号</b>与<b>邀请码</b>发给朋友，对方加入后把应答码粘贴回来。</div>'+
    '<div class="lab">房间号<button class="copybtn" data-c="rid">复制</button></div><input type="text" readonly id="ridTxt" value="'+rid+'">'+
    '<div class="lab">邀请码<button class="copybtn" data-c="offer">复制</button></div><textarea id="offerTxt" placeholder="正在生成…"></textarea>'+
    '<div class="lab">对方的应答码</div><textarea id="ansTxt" placeholder="粘贴对方返回的应答码"></textarea>'+
    '<div class="status wait" id="p2pStat">等待应答…</div>'+
    '<button class="btn gold" id="ansOk" disabled>建立连接</button> <button class="btn" id="p2pCancel">取消</button>'+
    '<div class="hint">连接建立后同屏轮流落子；断线可重新交换邀请码。</div>');
  $('#p2pCancel').onclick=()=>{try{pc.close()}catch(e){};$('#modal').classList.remove('show');newGame('local');};
  pc.createOffer().then(o=>pc.setLocalDescription(o)).catch(()=>{});
  (async()=>{await waitGather(pc);const sdp=pc.localDescription?pc.localDescription.sdp:'';
    if(!sdp){setConn('生成邀请码失败，请重试','wait');return}
    $('#offerTxt').value=sdp;$('#ansOk').disabled=false;setConn('🟡 等待中：把邀请码发给对方','wait');})();
  $('#mcard').querySelectorAll('.copybtn').forEach(b=>b.onclick=e=>{
    const v=e.target.dataset.c==='rid'?$('#ridTxt').value:$('#offerTxt').value;
    if(!v)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(()=>{e.target.textContent='✅ 已复制';setTimeout(()=>e.target.textContent='复制',1200)}).catch(()=>{})}
  });
  $('#ansOk').onclick=()=>{const ans=$('#ansTxt').value.trim();if(!ans)return;
    try{pc.setRemoteDescription(JSON.parse(ans))}catch(e){setConn('应答码无效','err');return}
    setConn('已连接应答…','wait');$('#ansOk').disabled=true;};
}
function openJoin(){
  try{if(peer)peer.close()}catch(e){}peer=null;dc=null;
  const pc=newPeer();peer=pc;
  if(!pc){alert('当前环境不支持 WebRTC');return}
  pc.ondatachannel=ev=>{dc=ev.channel;bindDc()};
  modal('<h2>🌐 加入房间（联机·围棋）</h2>'+
    '<div class="sub">你是 <b style="color:#ff9aa0">北大(白后手)</b>。粘贴房主的邀请码→生成应答码发回。</div>'+
    '<div class="lab">房主的邀请码</div><textarea id="offerIn"></textarea>'+
    '<div class="lab">应答码（发回给房主）<button class="copybtn" id="copyAns">复制</button></div><textarea id="ansOut" readonly placeholder="自动生成"></textarea>'+
    '<div class="status wait" id="p2pStat">等待邀请码…</div>'+
    '<button class="btn gold" id="goAns" disabled>生成应答码</button> <button class="btn" id="p2pCancel">取消</button>'+
    '<div class="hint">把应答码发回房主后即建立连接。</div>');
  $('#p2pCancel').onclick=()=>{try{pc.close()}catch(e){};$('#modal').classList.remove('show');newGame('local');};
  const gen=()=>{const sdp=$('#offerIn').value.trim();if(!sdp)return;
    try{pc.setRemoteDescription(JSON.parse(sdp))}catch(e){$('#p2pStat').textContent='邀请码无效';return}
    $('#goAns').disabled=true;
    pc.createAnswer().then(a=>pc.setLocalDescription(a)).catch(()=>{});
    (async()=>{await waitGather(pc);const s=pc.localDescription?pc.localDescription.sdp:'';
      if(!s){$('#p2pStat').textContent='生成失败';return}
      $('#ansOut').value=s;setConn('应答码已生成，请复制发给房主','wait');$('#p2pStat').textContent='✅ 应答码已生成';$('#p2pStat').className='status ok';})();};
  $('#goAns').onclick=gen;
  $('#offerIn').addEventListener('input',()=>{if($('#offerIn').value.trim())$('#goAns').disabled=false});
  $('#copyAns').onclick=()=>{const v=$('#ansOut').value;if(!v)return;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(v).then(()=>{$('#copyAns').textContent='✅ 已复制';setTimeout(()=>$('#copyAns').textContent='复制',1200)}).catch(()=>{})}};
}
function openP2P(){
  modal('<h2>🌐 联机对战</h2><div class="rows">'+
    '<div class="mode-card" id="mkCreate"><b>🎮 创建房间</b><small>清华黑先 · 生成邀请码</small></div>'+
    '<div class="mode-card" id="mkJoin"><b>🤝 加入房间</b><small>北大白后 · 粘贴邀请码</small></div></div>'+
    '<button class="btn" id="p2pBack">返回</button>');
  $('#p2pBack').onclick=()=>{$('#modal').classList.remove('show');newGame('local');};
  $('#mkCreate').onclick=()=>{p2pRole=1;openCreate()};
  $('#mkJoin').onclick=()=>{p2pRole=2;openJoin()};
}

/* 初始化 */
resetBoard();

</script>
</body>
